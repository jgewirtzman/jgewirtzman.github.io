name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cv-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Check out CV source (private)
        uses: actions/checkout@v4
        with:
          repository: jgewirtzman/jgewirtzman-cv
          token: ${{ secrets.SITE_CV_TOKEN }}
          path: cv

      - name: Install TeX Live
        timeout-minutes: 15  # apt mirrors occasionally stall; fail fast instead of hanging
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra lmodern biber latexmk

      - name: Build public CV
        working-directory: cv
        run: |
          latexmk cv-public.tex
          mkdir -p ../files
          cp build/cv-public.pdf ../files/Gewirtzman_CV.pdf

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
